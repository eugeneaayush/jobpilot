name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobpilot_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: jobpilot_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot_test -d jobpilot_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup locked Python utilities
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install PDF verification tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test locked Python utilities
        working-directory: services/local-tools
        run: |
          uv sync --frozen
          uv run --frozen pytest -q

      - name: Install synthetic browser runtime
        run: bun x playwright install --with-deps chromium

      - name: Test marketplace staging
        run: |
          fixture="$(mktemp -d)"
          claude="$fixture/claude"
          codex="$fixture/codex"
          mkdir -p "$claude/plugins/jobpilot" \
                   "$codex/plugins/jobpilot/.codex-plugin" \
                   "$codex/.agents/plugins"
          jq -n '{
            name: "sukhrob-codex-plugins",
            interface: { displayName: "Sukhrob Codex Plugins" },
            plugins: [{
              name: "jobpilot",
              source: { source: "local", path: "./plugins/jobpilot" },
              policy: { installation: "AVAILABLE", authentication: "ON_USE" },
              category: "Productivity"
            }]
          }' > "$codex/.agents/plugins/marketplace.json"

          # Equal size and mtime reproduces the old rsync false-negative.
          cp -p plugin/.codex-plugin/plugin.json "$codex/plugins/jobpilot/.codex-plugin/plugin.json"
          sed -i '0,/jobpilot/s//jobpilox/' "$codex/plugins/jobpilot/.codex-plugin/plugin.json"
          touch -r plugin/.codex-plugin/plugin.json "$codex/plugins/jobpilot/.codex-plugin/plugin.json"

          bash .github/scripts/sync-marketplaces.sh . "$claude" "$codex"
          cmp plugin/.codex-plugin/plugin.json "$codex/plugins/jobpilot/.codex-plugin/plugin.json"

      - name: Lint & format check
        run: bun run ci

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # After db:generate: knip reads apps/api's imports of the generated client.
      - name: Dead code check
        run: bun run knip

      - name: Typecheck API
        run: bun run typecheck
        working-directory: apps/api

      - name: Check shared contracts and private scripts
        run: |
          bun --cwd=packages/contracts run typecheck
          bun run personal:typecheck
          bun --cwd=packages/contracts run test

      # Only the disposable service is reachable; private fixtures create/drop their own schemas.
      - name: Test API
        run: bun run test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-test-secret
          SECRET_MASTER_KEY: Y2ktdGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmc=
          PERSONAL_TEST_DATABASE_URL: postgresql://jobpilot_test:synthetic_test_only@localhost:5432/jobpilot_integration

      - name: Typegen web
        run: bun run typegen
        working-directory: apps/web

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build web
        run: bun run build
        working-directory: apps/web

  terminal:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-terminal-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test terminal host
        run: dotnet test tests/JobPilot.Terminal.Tests -c Release

      # JIT reflection can hide missing JsonSerializable registrations, so publish one Native AOT RID.
      - name: Publish AOT (linux-x64)
        run: dotnet publish -c Release -r linux-x64 -o publish/
        working-directory: apps/terminal

      # InstallPaths.Resolve() requires the plugin tree; Codex workers are repo-scoped runtime assets.
      - name: Verify publish root ships provider assets
        working-directory: apps/terminal/publish
        run: |
          for f in jobpilot \
                   plugin/.claude-plugin/plugin.json \
                   plugin/.codex-plugin/plugin.json \
                   plugin/.mcp.json \
                   plugin/skills/_shared/setup.md \
                   plugin/skills/auto-apply/SKILL.md \
                   .codex/agents/job-worker.toml \
                   .codex/agents/networking-worker.toml; do
            test -e "$f" || { echo "missing from publish root: $f"; exit 1; }
          done
          test ! -e .agents/plugins/marketplace.json || {
            echo "obsolete local Codex marketplace shipped in publish root"
            exit 1
          }

  docker:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-docker-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # deploy.yml builds these images on push to prod; a full checkout hides files the images omit.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          load: true
          tags: jobpilot-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:4101
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # /api/health never queries the database, so an unreachable URL still proves every import resolves.
      - name: Smoke-boot API image
        run: |
          docker run -d --name api-smoke -p 4101:4101 \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:1/smoke \
            -e JWT_SECRET=ci-smoke-secret \
            -e SECRET_MASTER_KEY=Y2ktdGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmc= \
            jobpilot-api:ci
          status=0
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:4101/api/health || status=1
          docker logs api-smoke
          docker rm -f api-smoke
          exit $status
